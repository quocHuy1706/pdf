{% extends "base.html" %}
{% block title %}Đăng ký{% endblock %}
{% block content %}
<div class="auth-box">
    <h1>Đăng ký tài khoản</h1>
    {% if error %}<p class="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/register" class="form">
        <label>Họ và tên</label>
        <input name="full_name" required placeholder="Nguyễn Văn A">
        <label>Email</label>
        <input type="email" name="email" required placeholder="email@example.com">
        <label>Mật khẩu</label>
        <input type="password" name="password" required minlength="6" placeholder="Tối thiểu 6 ký tự">
        <button class="btn" type="submit">Tạo tài khoản</button>
    </form>
    <p>Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
</div>
{% endblock %}
